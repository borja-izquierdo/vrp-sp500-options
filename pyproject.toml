[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp"
version = "1.0.0"
description = "Forecasting and trading the S&P 500 variance risk premium (MSc thesis code)"
authors = [{ name = "Borja Izquierdo Piñero" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "pyarrow>=16", "scikit-learn>=1.5",
  "xgboost>=3.0", "lightgbm>=4.5", "matplotlib>=3.9", "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
download = ["thetadata", "yfinance>=0.2.40"]
dev = ["pytest>=8", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
