# conda env create -f environment.yml && conda activate vrp
name: vrp
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy>=2.0
  - pandas>=2.2
  - pyarrow>=16
  - scikit-learn>=1.5
  - xgboost>=3.0
  - lightgbm>=4.5
  - matplotlib>=3.9
  - requests>=2.31
  - python-dotenv>=1.0
  - yfinance>=0.2.40
  - pytest>=8
  - jupyterlab
  - nbconvert
  - pip
  - pip:
      - thetadata          # official ThetaData client (only for download_data.py)
      - -e .
